name: Bizora Frontend QA

on:
  pull_request:
    branches:
      - website-ai-v2-switch
  push:
    branches:
      - 'bizora/**'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
